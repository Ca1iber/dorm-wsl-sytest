	<h1 class="topictitle1" id="ariaid-title1">Commands</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="80082.htm" title="The ACTIVE command is used to open (or activate) a row in a particular bank for a subsequent access. The value on the BA0,BA1, BA2 inputs selects the bank, and the address provided on inputs A0-A11 selects the row. This row remains active (or open) for accesses until a PRECHARGE command is issued to that bank. A PRECHARGE command must be issued before opening a different row in the same bank.">ACTIVE command</a></li><li><a href="80043.htm" title="WRITE bursts are initiated with a WRITE command (see following figure). The starting column and bank addresses are provided with the WRITE command, and auto precharge is either enabled or disabled for that access. If auto precharge is enabled, the row being accessed is precharged at the completion of the burst. For the generic WRITE commands used in the following illustrations, auto precharge is disabled.">Write bursts</a></li><li><a href="80045.htm" title="READ bursts are initiated with a READ command (see following figure). The starting column and bank addresses are provided with the READ command and auto precharge is either enabled or disabled for that burst access. If auto precharge is enabled, the row being accessed is precharged at the completion of the burst after tRAS(min) has been met. For the generic READ commands used in the following illustrations, auto precharge is disabled.">Read bursts</a></li></ol></div></nav>
