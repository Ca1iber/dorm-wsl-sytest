	<h1 class="topictitle1" id="ariaid-title1">Use of the FTCG (Functional Test ConfiGure) Command</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="55381.htm" title="By default, the primary sets are activated at the start of each functional test. This activation requires a CTOF (Change Timing On the Fly) sequence during which the tester sequencer is inactive. But when testing a PLL device, the clock must be running continuously during the whole test flow. The FTCG (Functional Test ConfiGure) command allows you to suppress the (re)activation of the primary sets for the clock pins of such a device. For general information on FTCG, see the Command Reference manual.">Suppressing Reactivation of Primary Sets with FTCG</a></li><li><a href="98606_5.htm" title="The FTCG command serves to change the system behavior with respect to the activation of primary sets.">FTCG, FTCG? - (Functional Test ConfiGure)</a></li></ol></div></nav>
