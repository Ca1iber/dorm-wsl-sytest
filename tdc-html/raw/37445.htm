	<h1 class="topictitle1" id="ariaid-title1">Basic Translation Process</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="37447.htm" title="First the timing translator translates the ASCII timing file. The information of the event sequences, which already contain delays for every action, is separated on the one hand into a wavetable, and on the other hand into a timing set.">Timing Translation</a></li><li><a href="37450.htm" title="In the second step, the vector translator converts the ASCII vector file into a binary vector file. This includes converting the state characters of the ASCII vector file into physical waveform DC/DC power units.">Vector Translation</a></li><li><a href="37452.htm" title="The following figure gives a comprehensive overview of the translation process for the ASCII timing and vector file fragments displayed in ASCII Timing File and ASCII Vector File. The vertical layout of the figure roughly corresponds to the chronological order.">The Overall Process</a></li></ol></div></nav>
	
	
	<div><p>The ASCII interface processes these input files in two steps:</p>
		<ul>
			<li>timing translation</li>
			<li>vector translation.</li>
		</ul>
		<p>Each step is performed by a different module. </p>
	</div>
