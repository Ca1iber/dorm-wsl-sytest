	<h1 class="topictitle1" id="ariaid-title1">Counted match loops supporting in the APG program file</h1>
	
	
	<div><p>The MTL starts to support counted match loops in the APG program file since MTP
		3.4.1.</p>
		<section class="section"><h2>Fundamental reading</h2><p><a href="102610.htm" title="The APG program file syntax supports for loops and Counted match loops. You can use these loops for repeating any set of instructions. for loops are specially useful for iterating the same instructions over columns, rows, and banks of memory devices. Match loops are functionally equivalent to repeat...until loops with an upper limit of how often they can be repeated.">Loops</a></p><p><a href="114614.htm" title="Match loops are specialized loop constructs in the device access file or program file. Match loops are functionally equivalent to repeat...until loops with an upper limit of how often they can be repeated.">Counted match loops</a></p></section>
	</div>
