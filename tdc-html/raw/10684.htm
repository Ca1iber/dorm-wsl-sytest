	<h1 class="topictitle1" id="ariaid-title1">Remove</h1>
	
	
	<div><p>The <span class="keyword">Remove</span> subcommand is used to delete a list or to delete all
		lists.</p>
		<h2>Syntax</h2><div class="syntax"><pre class="prettyprint copyable singleline">DDEF {"<span class="keyword">ListName</span>" | ALL},{REMOVE},,</pre></div>
		<h2>Example</h2><div class="example"><pre class="prettyprint linenums copyable">DDEF "listA",REMOVE,,
DDEF ALL,REMOVE,,</pre></div>
	</div>
<div class="changes"><h2>Functional changes</h2><ol><li>Introduced before SmarTest 6.3.2</li></ol></div></article></main><footer role="contentinfo"><div class="fo"><span id="sf"></span><span id="sl"></span><span class="tj">Topic 10684</span><script type="text/javascript">var ti='10684';var tt='Remove'</script></div></footer><script type="text/javascript" src="tdc.js"></script></body></html>
