	<h1 class="topictitle1" id="ariaid-title1">Parameter: perform_subdie_probing</h1>
	
	
	<div><p>This parameter determines whether the driver will perform the actions required for
		sub-die probing, or skip these actions.</p>
		<p><strong>Driver default:</strong> "no"</p>
		<p><strong>Changeable at run-time:</strong> no</p>
		<p><strong>Applicable for:</strong> prober</p>
		<p><strong>Example:</strong> perform_subdie_probing: "yes"</p>
	</div>
