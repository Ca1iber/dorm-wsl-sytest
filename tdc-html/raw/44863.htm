	<h1 class="topictitle1" id="ariaid-title1">User Flags</h1>
	
	<div><p>User flags are of type <span class="keyword">integer</span>. The flags take on the name that the user
		specifies.</p><p>User Flags are defined in the <a href="99275.htm" title="On this page, you can add, delete, and edit variables.">Variables page</a> of the <a href="99271.htm" title="The Flow Data Editor consists of eight pages.">Flow Data Editor</a> and stored in
			the <span class="keyword">flags</span> section of the <a href="43086.htm" title="The testflow tool stores the data in the testflow file located in the directory <device_dir&gt;/testflow">Testflow file</a>.</p></div>
