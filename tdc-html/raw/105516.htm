	<h1 class="topictitle1" id="ariaid-title1">Concepts of test result processing</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="58784.htm" title="FTST? executes a functional test and returns a global pass or fail result. If you want a combined result for a subset of the configured pins, then you must use PASS?. More detailed information can be obtained by CHER?, which returns a separate result for every specified pin.">Global result queries</a></li><li><a href="58768.htm" title="The Error Map is used by SmarTest to record information about failing test cycles. This forms the basis for the analysis of the test results. In fact, SmarTest provides two Error Maps, a detailed and an overview Error Map. The detailed Error Map provides information on the cycle or even the edge level. The overview Error Map combines multiple cycles into one result, which is Failed if at least one of the cycles failed. It can be operated in two modes. You can specify a fixed number of cycles that are to be represented by one bit, or you can request one result for every main pattern of a (single-port or multi-port) burst; this latter option allows you to identify the failing patterns of a burst.">Using the Error Maps</a></li><li><a href="58785.htm" title="The subsidiary queries do not require that a test has been executed. However, the label (pattern) you are interested in must have been defined as the start label with SQSL, and the timing setup with which it is to be run must have been declared the primary timing with SPRM.">Subsidiary queries</a></li><li><a href="12334.htm" title="The High Resolution Timing Diagram allows you to select a range of cycles and examine them in detail. In order to create and use the high resolution timing diagram you must use the HRIT command to provide the following information:">Creating a high resolution timing diagram</a></li></ol></div></nav>
