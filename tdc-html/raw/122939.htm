	<h1 class="topictitle1" id="ariaid-title1">Edge Conversion tool</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="122940.htm" title="With SmarTest 7.0, all firmware commands and syntax elements, which deal with &#34;bidirectional edges&#34; are obsolete. Bidirectional edges are e1 to e6, which are replaced by the unidirectional edges d1 to d6 (drive direction) and r1 to r6 (receive direction), respectively. The direction, which must be used to replace a bidirectional edge, depends on the action, which is assigned to the edge. E-edge conversion tool (eedge tool) automatically converts &#34;bidirectional edges&#34; to &#34;unidirectional edges&#34;.">Why converting edges?</a></li><li><a href="122941.htm" title="The e-edge conversion tool is a one-button tool that converts bidirectional edges to unidirectional edges. It takes a V93000 timing file as input and gives a V93000 timing file as output.">Conversion rules</a></li><li><a href="122944.htm">Wavetables</a></li><li><a href="122942.htm" title="Equation based setups must no longer contain any syntax elements, which deal with bidirectional edges. This affects timing equations and wavetables.">Timing Equation</a></li><li><a href="123170.htm">Conversion Procedure</a></li><li><a href="113740_3.htm" title="The main difference between legacy and Smart Scale waveforms is that there are now separate sets of edges for drive actions and for tri-state actions. There are thus 16 drive edges each of which can be associated with a different delay. Waveforms for Smart Scale pins can be specified in two formats.">Defining waveform shapes for Smart Scale pins</a></li></ol></div></nav>
