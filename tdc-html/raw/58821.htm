	<h1 class="topictitle1" id="ariaid-title1">Deleting a label</h1>
	
	
	<div><p>You can delete a label with the <span class="keyword">DLTS</span><strong> </strong>command. If this happens,
		SmarTest readjusts the location of the vector data, so that no "holes" are generated in the
		memory.</p></div>
