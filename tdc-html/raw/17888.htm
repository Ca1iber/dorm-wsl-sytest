	<h1 class="topictitle1" id="ariaid-title1">Clearing the Timing Setup</h1>
	
	
	<div><p>Whenever you want to set up new device timing you'll have to clear the old setup first.
		You do this by loading the default timing setup (which is no setup).</p>
		<p>In the Edit pulldown menu pick the option <kbd class="userinput">defaults</kbd>. </p>
