	<h1 class="topictitle1" id="ariaid-title1">Parameter: bin_data_hold_time</h1>
	
	
	<div><p>The time in milliseconds the driver will keep the bin data signal stable after the
		end-of-test pulse. </p>
		<p><strong>Driver default:</strong> depends on plug-in</p>
		<p><strong>Changeable at run-time:</strong> yes</p>
		<p><strong>Applicable for:</strong> handlers and probers</p>
		<p><strong>Example:</strong> bin_data_hold_time: 3</p>
