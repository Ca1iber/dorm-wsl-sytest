	<h1 class="topictitle1" id="ariaid-title1">Deleting a Tone</h1>
	
	
	<div><p>To delete all tones, click the Clear Tones button at the bottom of the dialog
		window.</p>
		<p>To delete a single tone, type in a 0 in the bin field of that tone and press Enter.</p>
	</div>
