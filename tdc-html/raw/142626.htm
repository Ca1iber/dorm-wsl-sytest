	<h1 class="topictitle1" id="ariaid-title1">BfdGenerator</h1>
	
	
	<div><p>The BfdGenerator class is a new API that lets you create bit fail maps under control of
		your own test methods or other tools. </p>
		<p>The generated bit fail maps can be displayed with the Bit Fail Map Viewer.</p>
