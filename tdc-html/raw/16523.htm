	<h1 class="topictitle1" id="ariaid-title1">When merging attributes</h1>
	
	
	<div><p>Only pin attributes for pins of the loaded configuration can be merged. If the
		attributes file that is merged contains attributes for other pins, these attributes will be
		ignored.</p></div>
