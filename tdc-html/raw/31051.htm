	<h1 class="topictitle1" id="ariaid-title1">Change Graph Style</h1>
	
	
	<div><p>The Waveform Graphs Tool (WGT) allows you to select from normal or bar graph styles.
		These styles are selectable via the <a href="31462.htm" title="The Format dialog box of the Waveform Graphs Tool (WGT) allows you to customize almost all the context information of the graph, such as title, axis, grid, cursor, marker, and trace. This dialog box can be opened from the Format &gt; Edit menu in the Menu Bar and also from the Tool Bar.">Format Dialog Box</a> or the <a href="31245.htm" title="The Data Display API reference is organized by class. For each class, the description, syntax, class definition, constructors, member functions, parameters and examples are provided. You can find the detail information below.">Data Display API</a>. The
		following shows a bar graph style.</p>
		<div class="p"><figure class="fignone">
				<img src="45808.png" alt="Bar Graph">
			</figure></div>
	</div>
