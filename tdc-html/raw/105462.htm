	<h1 class="topictitle1" id="ariaid-title1">List of routing setup commands</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="98578_3.htm" title="The DSCP command serves to define the maximal number of instances for the different types of so called parameter sets, and to reserve the necessary space for them in the Sequencer Memory. The space can be calculated from the number of instances because every instance of the same type has the same size. The DSCP? query returns the existing settings. This command replaces the command CNTR, CNTR? used in previous releases.">DSCP, DSCP? - (Define System Control Parameter)</a></li><li><a href="99079_2.htm" title="The SRPR (Set Routing PRimary) command sets a routing set as the primary routing set, which should be activated with the next command.">SRPR, SRPR? - (Set Routing PRimary)</a></li><li><a href="99081_2.htm" title="The UDRS (UnDefine Routing Set) command deletes the specified routing set.">UDRS - (UnDefine Routing Set)</a></li></ol></div></nav>
