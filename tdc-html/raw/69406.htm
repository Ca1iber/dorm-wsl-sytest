	<h1 class="topictitle1" id="ariaid-title1">GPIB driver configurations</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="69415.htm" title="This section provides general information about the Tesec GPIB handler driver.">General information about the Tesec GPIB handler driver</a></li><li><a href="69416.htm" title="This section describes the variables used in the configuration files.">Default GPIB configuration</a></li><li><a href="69417.htm" title="At start up of the driver, the driver resets the GPIB bus to ensure stable operation. If the handler receives the reset and has already devices pending for test, it will bin these devices to a default location. I.e. these devices are not tested. Therefore it is best practice to start the test program on the test system first, before handling of devices is activated at the handler.">Startup conditions</a></li><li><a href="69418.htm" title="The Tesec 9588 provides two different GPIB protocol modes: The LTX mode (GP-IB1) mode and the Theradyne mode (GP-IB2) on the handler's menu. The LTX mode is out of date. To run with the Tesec GPIB handler driver, the handler must be set to the Theradyne mode. The two modes are not compatible.">GPIB Protocols</a></li><li><a href="69419.htm" title="This section describes the GPIB communication between the driver and the handler.">GPIB communication flow for Tesec handlers</a></li></ol></div></nav>
