	<h1 class="topictitle1" id="ariaid-title1">Concepts of source synchronous testing (html)</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="84446.htm" title="In source synchronous devices, the phase of the device output clock and the output data cannot only show a static offset relative to the reference clock (which varies from device to device), but also a common dynamic distortion during execution of a pattern. This distortion can be the same for each pattern execution on the same device (deterministic distortion), but it can also vary from one pattern execution to the next.">Principles of source synchronous testing</a></li><li><a href="85197.htm" title="Source synchronous testing is rather time consuming. First, it requires multiple executions of the same functional test. Second, the results of each execution (shot) must be combined with the already existing global results for the previous shots. Finally, if this result accumulation is executed on the workstation, the results must be uploaded after each shot.">Exploiting hardware resources for performance enhancement</a></li></ol></div></nav>
