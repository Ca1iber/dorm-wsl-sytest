	<h1 class="topictitle1" id="ariaid-title1">Function: ph_driver_done</h1>
	
	
	<div><p>This function closes the connection to the equipment and terminates the
		driver.</p>
		<p>ph_driver_done should always be called at the end of the application model.</p>
		<p><strong>Applicable for:</strong> handler and prober driver</p>
		<p><strong>Example:</strong> PROB_HND_CALL (ph_driver_done)</p>
	</div>
