	<h1 class="topictitle1" id="ariaid-title1">RDI_INIT()</h1>
	
	
	<div><p>Initializes an environment for SmartRDI.</p>
		<section class="section"><p>After the execution of the test suite is done, the environment is
			cleared.</p></section>
		<h2>Syntax</h2><div class="syntax"><pre class="prettyprint copyable singleline">RDI_INIT();</pre></div>
		<section class="section">
			<p><span class="keyword">RDI_INIT()</span> must be called before <a href="29526.htm" title="This API declares the beginning of the block that enables you to execute setup and test for all sites in parallel, when the program is run for the first tested site.">ON_FIRST_INVOCATION_BEGIN();</a>.</p>
		</section>
	</div>
<div class="changes"><h2>Functional changes</h2><ol><li>Introduced in SmartRDI 2.1.0</li></ol></div></article></main><footer role="contentinfo"><div class="fo"><span id="sf"></span><span id="sl"></span><span class="tj">Topic 141275</span><script type="text/javascript">var ti='141275';var tt='RDI_INIT()'</script></div></footer><script type="text/javascript" src="tdc.js"></script></body></html>
