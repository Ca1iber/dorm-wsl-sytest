	<h1 class="topictitle1" id="ariaid-title1">Basic Considerations</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="42567.htm" title="There are two general strategies you can follow with multisite testing (see the figure below),">Ways of Optimizing Throughput</a></li><li><a href="42568_2.htm" title="From the perspective of the application model there is no difference between multisite and single-site testing, except for the fact that the device level and the test level are now running very fast.">Application Model for Multisites</a></li><li><a href="42569.htm" title="Before you design a multisite DUT board, you need to determine the test system resources, such as the number of channels, the number of device power supply (DPS) channels and the device pin count. These are all major aspects when designing a multisite DUT board.">Multisite DUT board design</a></li><li><a href="42570.htm" title="The pin configuration is taken from the single site, but with a modified assignment of test system channels for the additional sites.">Multi-site Pin Configuration</a></li><li><a href="97162_2.htm" title="In a multisite environment, a digital channel is usually dedicated to a specific test site. When this channel becomes unavailable, the whole site becomes unavailable for testing. With the site disabling function you can make a site unavailable without affecting the testing on other sites.">Site disabling</a></li><li><a href="97987_2.htm" title="When multiple sites with many digital channels are tested, there are rare cases where a digital channel becomes defect. Depending on the failure's root cause, a particular user action is required.">User actions for disabled sites</a></li><li><a href="98284.htm" title="The offline mode stores the data per pin, which means that if the same pin is defined for various sites, the data that is used will only be the data that was defined for the first site.">Offline Mode</a></li></ol></div></nav>
