	<h1 class="topictitle1" id="ariaid-title1">Exit Status</h1>
	
	
	<div><p>The exit status of the program conveys the success or failure of the program execution,
		and must be set. For a full explanation of the available exit codes, see <a href="44859.htm" title="Any unit (function, program, script or VEE object) must return one of the following predefined constants. Where constants are not available (script/VEE), then the respective values [0..3] must be assigned as the return status.">Return Codes</a>.
		The following line shows an example: </p>
		<p><kbd class="userinput">exit(CI_CALL_PASS)</kbd></p>
	</div>
