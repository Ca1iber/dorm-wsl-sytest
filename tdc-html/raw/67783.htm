	<h1 class="topictitle1" id="ariaid-title1">Define the data sequencing</h1>
	
	
	<div><p>The last element of a memory test pattern definition is the data sequencing. The
		contents of the data word may be changed depending on the address. </p>
		<p>There are two typical industry descriptions for data sequencing: </p>
		<ul>
			<li>Solid </li>
			<li>Checkerboard</li>
		</ul>
	</div>
