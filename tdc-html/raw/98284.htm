	<h1 class="topictitle1" id="ariaid-title1">Offline Mode</h1>
	
	
	<div><p>The offline mode stores the data <em>per pin</em>, which means that if the same pin is
		defined for various sites, the data that is used will only be the data that was defined for the
		first site.</p></div>
