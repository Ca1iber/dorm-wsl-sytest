	<h1 class="topictitle1" id="ariaid-title1">Set Bin Counters to Zero</h1>
	
	
	<div><p></p>
		<section class="section"><h2>Use</h2><p><kbd class="userinput">long ClearBins(void)</kbd></p><p>Sets the die
				counters of all bins and of all sites to zero. </p><p>The return value is 0 if okay, !=0
				otherwise. </p><div class="note"><span class="title">Note</span> This function only resets the counters of
					<kbd class="userinput">GetBinList()</kbd>, and does not affect the data log.</div></section>
	</div>
