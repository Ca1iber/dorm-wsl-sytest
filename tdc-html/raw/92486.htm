	<h1 class="topictitle1" id="ariaid-title1">Memory test using per-pin APG</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="92489.htm" title="When generating a standard test, a set of vectors are generated and then loaded into the vector memory (SDRAM). These vectors are applied to the DUT. The sequencer program controls the execution sequence of all drive (and compare) data. It is loaded into the sequencer memory (SRAM)">Vector generation</a></li><li><a href="92487.htm" title="This section describes the behavior of error acquisition using the Error Map memory, called the &#34;8k Error Map acquire failure mode&#34;. The SmarTest provides another mode for large error acquisition, called the &#34;large acquire failure mode (LAFM)&#34;. For more information of both the acquire failure modes, see Acquire failure modes.">Error acquisition</a></li><li><a href="92488.htm" title="In contrast to the 8k Error Map acquire failure mode, which relies on the called &#34;8k Error Map memory&#34; (which is embedded in the test processor), the large acquire failure mode (LAFM) acquires failing cycles in the much larger vector memory.">Acquire failure modes</a></li></ol></div></nav>
