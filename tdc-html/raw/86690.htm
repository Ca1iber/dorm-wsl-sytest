	<h1 class="topictitle1" id="ariaid-title1">Pin Multiplexing</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="37580.htm" title="You can attach more than one test system channel to one DUT pin in order to circumvent restrictions concerning the number of waveforms or edges. In the ASCII timing file and the ASCII vector file, you specify information for the DUT pin. The ASCII interface then creates the setup for the different associated channels. The creation of the timing setup for this kind of multiplexing is described in The Pin Multiplexing File (*.mux).">The (muxio) Mode Qualifier</a></li><li><a href="86691.htm" title="In contrast to normal multiplexing, the (muxio) qualifier cannot be used for the vector translation of HXA multiplexing. Rather, you must pass the multiplexing file to v2b with the -K option. The pins in the ASCII vector file must be the HXA pins. Accordingly, the phase reference pins must be omitted.">Vector Translation for HXA Multiplexing</a></li></ol></div></nav>
	
	
	<div><p>The vector translation for multiplexed pins differs for standard multiplexing and HXA
		multiplexing. The details will be given in the following two subsections.</p></div>
