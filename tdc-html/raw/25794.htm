	<h1 class="topictitle1" id="ariaid-title1">Miscellaneous Considerations for DC tests</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="25795.htm" title="DC measurements using the PMU are made with the test system in the break state. The DUT must be kept in a stable condition while dc measurements are being made, therefore care must be taken to ensure that the break waveform of the active waveform set does not cause toggling.">DUT Signal Stability During DC Tests</a></li><li><a href="25796.htm" title="The dc rail is precharged to a voltage so as to avoid hot switching of the PPMU relay when it closes. This precharge voltage can be specified for the Leakage and GeneralPMU test method.">Precharging of DC Rails</a></li><li><a href="25797.htm" title="If you apply the resistive divider technique, the voltage drop across the series resistor (between pogo pin and DUT pin) is not compensated for, when performing measurements with the PPMU.">Resistive Dividers</a></li><li><a href="25802.htm" title="The active load sources or sinks a current at a pin of your device. It is a component of the per-pin electronics and can be connected to a device pin by closing the AC relay of the corresponding test system channel.">Active Load</a></li></ol></div></nav>
