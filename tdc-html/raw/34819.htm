	<h1 class="topictitle1" id="ariaid-title1">DRLPinName</h1>
	
	
	<div><p>A variable of this type holds the name of a pin as a NULL terminated string and the pin
		index, see <em><a href="34818.htm" title="A variable of this type holds a pin index. See DRLPinIndexToName for further information on pin DC/DC power units and on mapping pin DC/DC power units to pin names.">DRLPinIndex</a></em>.</p>
		<div></div><pre class="prettyprint linenums copyable">typedef struct {
  char *name;
  <a href="34818.htm" title="A variable of this type holds a pin index. See DRLPinIndexToName for further information on pin DC/DC power units and on mapping pin DC/DC power units to pin names.">DRLPinIndex</a> index;
} DRLPinName;</pre><div></div>
	</div>
