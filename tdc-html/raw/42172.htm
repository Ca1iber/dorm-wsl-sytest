	<h1 class="topictitle1" id="ariaid-title1">Configuration Parameters for Driver Mode</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="55703.htm" title="For demonstrations, debug scenarios, and problem analysis, the driver may work in &#34;off-line&#34; mode rather then in &#34;on-line&#34; mode. During off-line mode, no communication with the equipment takes place. Instead, the equipment's behavior is simulated to the driver (error-free operation is simulated).">Parameter: communication_mode</a></li><li><a href="55704.htm" title="Sometimes it is necessary for the operator to remove the handler from the test system and to do the device handling by hand. This may even be necessary during driver run-time.">Parameter: hand_test_mode</a></li><li><a href="55705.htm" title="Sometimes it is necessary to slow down all driver operations, for example when testing a new application model, or when analyzing a malfunction.">Parameter: single_step_mode</a></li></ol></div></nav>
	
	
	<div><p>These parameters allow you to set the driver to special modes of operation which differ
		from the normal mode.</p></div>
