	<h1 class="topictitle1" id="ariaid-title1">Concepts of the TMU per pin</h1><nav role="navigation"><div id="st"><h4>Subtopics</h4><ol><li><a href="125212.htm" title="The Time Measurement Unit (TMU) per Pin functionality is integrated into the test processor of the Smart Scale cards. It provides a fast and easy way to accurately measure the period (frequency), jitter, pulse width, and rise/fall time of periodic and non-periodic output signals.">TMU per Pin overview</a></li><li><a href="125428.htm" title="Normally, TMU measurements are started by executing special arming waveforms in a pattern. An arming waveform must specify the ARM action for a receive edge. An example is given by the following wavetable fragment:">Starting a TMU measurement</a></li><li><a href="126268.htm" title="By default, only the results of the last TMU measurement execution are stored. You can, however, store the results of more than one measurement by defining a dedicated storage area for a measurement. This is done by defining (or activating) a handle for the respective measurement with the TSRH? query. Different handles point to different storage locations.">Storing the results of more than one TMU measurement</a></li><li><a href="125483.htm" title="The following describes how to set up and execute a TMU measurement on the firmware level for a PS1600 pin in STDDIFF mode.">How to set up and execute a TMU measurement</a></li><li><a href="129473.htm" title="The input signal for the event discarding block represents every DUT event that was not suppressed by the prescaler by a short positive pulse. The width of this pulse depends on the primary timing, in particular on the clock resolution and the master clock (for which see Period resolution, clock resolution, and master clock period). Its range is between 5.5 ns and 6.75 ns.">Dealing with very high data rates</a></li></ol></div></nav>
